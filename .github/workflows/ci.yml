name: CI
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run check:tenant-isolation
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/ci
          NEXTAUTH_SECRET: ci-secret
          NEXTAUTH_URL: http://localhost:3000
